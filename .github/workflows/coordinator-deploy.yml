name: Coordinator bounded passive diagnostic

# Operations branch only: do not merge this replacement of the deploy workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-deploy
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: coordinator
    steps:
      - name: Observe existing worker traffic with a temporary Tail
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NODE_NO_WARNINGS: "1"
        run: |
          node --input-type=module <<'JS'
          const ACCOUNT = "91b59577e757131d68d55a471fe32aca";
          const WORKER = "crabbox-coordinator";
          const BASE = "https://api.cloudflare.com/client/v4/accounts/" + ACCOUNT + "/workers/scripts/" + WORKER + "/tails";
          const BRANCH = "refs/heads/ops/capacity-settings-20261011";
          const MAX_INCOMING = 2 * 1024 * 1024;
          const MAX_OUTPUT = 64 * 1024;
          const MAX_EVENTS = 200;
          const UUID = /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/;
          class Refusal extends Error {}
          function requireFact(condition, code) { if (!condition) throw new Refusal(code); }
          function context() {
            const e = process.env;
            requireFact(e.GITHUB_REPOSITORY === "openclaw/crabbox" && e.GITHUB_EVENT_NAME === "workflow_dispatch" &&
              e.GITHUB_REF === BRANCH && e.GITHUB_WORKFLOW_REF ===
              "openclaw/crabbox/.github/workflows/coordinator-deploy.yml@" + BRANCH &&
              /^[0-9a-f]{40}$/.test(e.GITHUB_SHA || "") && e.GITHUB_WORKFLOW_SHA === e.GITHUB_SHA &&
              e.GITHUB_RUN_ATTEMPT === "1", "workflow_identity");
            requireFact(typeof WebSocket === "function" && typeof fetch === "function", "runtime_unavailable");
            const token = e.CLOUDFLARE_API_TOKEN;
            delete e.CLOUDFLARE_API_TOKEN;
            requireFact(typeof token === "string" && token.length > 0 && !/\s/.test(token), "token_unavailable");
            return token;
          }
          async function request(token, method, id, state) {
            requireFact((method === "POST" && id === null) ||
              (method === "DELETE" && /^[A-Za-z0-9_-]{1,32}$/.test(id)), "request_scope");
            try {
              const response = await fetch(BASE + (id === null ? "" : "/" + id), {
                method, redirect: "error", signal: AbortSignal.timeout(30000),
                headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", Accept: "application/json" },
                ...(method === "POST" ? { body: "{}" } : {})
              });
              const slot = method === "POST" ? "create" : "delete";
              state[slot + "_http_status"] = response.status;
              const reader = response.body.getReader();
              const chunks = []; let bytes = 0;
              try {
                while (true) {
                  const part = await reader.read();
                  if (part.done) break;
                  bytes += part.value.byteLength;
                  requireFact(bytes <= 128 * 1024, "api_response_limit");
                  chunks.push(part.value);
                }
              } finally { await reader.cancel(); }
              let value;
              try { value = JSON.parse(Buffer.concat(chunks).toString("utf8")); }
              catch { throw new Refusal(response.status === 200 ? "api_json" : "http_status"); }
              const codes = new Set([10000, 1101]);
              const errors = Array.isArray(value?.errors) ? value.errors.slice(0, 16) : [];
              state[slot + "_error_codes"] = errors.map(item => item?.code).filter(code => codes.has(code));
              state[slot + "_other_error_count"] = errors.filter(item => !codes.has(item?.code)).length;
              requireFact(response.status === 200, "http_status");
              requireFact(value && value.success === true && Array.isArray(value.errors) && value.errors.length === 0,
                "api_response");
              return value.result;
            } catch (error) {
              if (error instanceof Refusal) throw error;
              throw new Refusal("request_unavailable");
            }
          }
          function tailUrl(value) {
            requireFact(typeof value === "string" && value.length <= 2048, "tail_url_shape");
            let url;
            try { url = new URL(value); } catch { throw new Refusal("tail_url_shape"); }
            // This documented Tail authority is admitted narrowly; unsupported API shapes stop with cleanup.
            requireFact(url.protocol === "wss:" && url.hostname === "tail.developers.workers.dev" &&
              !url.username && !url.password && !url.hash && (!url.port || url.port === "443") &&
              url.pathname.length > 1 && url.pathname.length <= 1024, "tail_url_authority");
            return url.href;
          }
          function category(message) {
            const text = typeof message === "string" ? message.slice(0, 8192).toLowerCase() : "";
            if (/durable object.*(?:reset|restart)|(?:reset|restart).*durable object/.test(text)) return "durable_object_reset";
            if (/sqlite|sql syntax|sql query|sql error/.test(text)) return "sql";
            if (/storage|database|transaction/.test(text)) return "storage";
            if (/memory|heap|out of memory/.test(text)) return "memory";
            if (/cpu|execution time|time limit/.test(text)) return "cpu";
            if (/(?:cancel|abort|disconnect).*(?:i\/o|io|request|operation)|(?:i\/o|io).*cancel/.test(text)) return "canceled_io";
            if (/typeerror|referenceerror|rangeerror|syntaxerror|is not (?:defined|a function)/.test(text)) return "javascript";
            return "unknown";
          }
          function project(value) {
            requireFact(value && typeof value === "object" && !Array.isArray(value), "event_shape");
            const outcomes = new Set(["ok", "exception", "exceededCpu", "exceededMemory", "canceled",
              "scriptNotFound", "responseStreamDisconnected", "unknown"]);
            const names = new Set(["Error", "TypeError", "ReferenceError", "RangeError", "SyntaxError",
              "URIError", "EvalError", "AggregateError", "DOMException"]);
            const timestamp = Number.isSafeInteger(value.eventTimestamp) &&
              value.eventTimestamp >= 946684800000 && value.eventTimestamp < 4102444800000
                ? new Date(value.eventTimestamp).toISOString() : null;
            const exceptions = (Array.isArray(value.exceptions) ? value.exceptions : []).slice(0, 4).map(item => {
              const entry = item && typeof item === "object" ? item : {};
              const stack = typeof entry.stack === "string" ? entry.stack.slice(0, 8192) : "";
              const frames = [];
              const pattern = /(?:^|[\s(/\\])(worker\.js|index\.js|index\.ts|fleet\.ts|storage\.ts|usage\.ts|org-records\.ts|postgres-store\.ts|coordinator-runtime\.ts|auth\.ts):([0-9]{1,7}):([0-9]{1,7})(?=$|[\s)])/g;
              for (const match of stack.matchAll(pattern)) {
                if (frames.length === 2) break;
                frames.push({ source: match[1], line: Number(match[2]), column: Number(match[3]) });
              }
              return { name: names.has(entry.name) ? entry.name : "unknown", category: category(entry.message), frames };
            });
            return { timestamp, outcome: outcomes.has(value.outcome) ? value.outcome : "unknown",
              script_version: UUID.test(value.scriptVersion?.id || "") ? value.scriptVersion.id : null, exceptions };
          }
          async function observe(url, state) {
            return await new Promise(resolve => {
              let settled = false; let openTimer; let observationTimer;
              const finish = reason => {
                if (settled) return;
                settled = true; state.reason = reason;
                clearTimeout(openTimer); clearTimeout(observationTimer);
                try { state.socket.close(1000, "bounded observation complete"); state.socket_close_requested = true; }
                catch { state.socket_close_requested = false; }
                resolve();
              };
              try {
                // The capability URL authenticates the socket. Never forward the API token.
                state.socket = new WebSocket(url, "trace-v1");
                state.socket.binaryType = "arraybuffer";
                openTimer = setTimeout(() => finish("websocket_open_timeout"), 15000);
                state.socket.addEventListener("open", () => {
                  if (settled) return;
                  try {
                    clearTimeout(openTimer); state.connected = true;
                    state.socket.send(JSON.stringify({ debug: false }));
                    observationTimer = setTimeout(() => finish("observation_elapsed"), 60000);
                  } catch { finish("websocket_send_failed"); }
                });
                state.socket.addEventListener("message", event => {
                  if (settled) return;
                  try {
                    const raw = typeof event.data === "string" ? Buffer.from(event.data, "utf8") :
                      event.data instanceof ArrayBuffer ? Buffer.from(event.data) : null;
                    if (!raw) return finish("websocket_frame_shape");
                    state.incoming_bytes += raw.length;
                    if (state.incoming_bytes > MAX_INCOMING) return finish("incoming_limit");
                    state.events_seen += 1;
                    let row;
                    try { row = project(JSON.parse(raw.toString("utf8"))); }
                    catch { state.invalid_events += 1; }
                    if (row) {
                      const encoded = JSON.stringify(row);
                      if (state.projected_bytes + Buffer.byteLength(encoded) + 1 > MAX_OUTPUT - 4096)
                        return finish("safe_output_limit");
                      state.events.push(row); state.projected_bytes += Buffer.byteLength(encoded) + 1;
                    }
                    if (state.events_seen >= MAX_EVENTS) finish("event_limit");
                  } catch { finish("event_unavailable"); }
                });
                state.socket.addEventListener("error", () => finish("websocket_error"));
                state.socket.addEventListener("close", () => finish("websocket_closed"));
              } catch { finish("websocket_unavailable"); }
            });
          }
          async function main() {
            const state = { create_attempts: 0, created: false, tail_id: null, expires_at: null,
              connected: false, socket_close_requested: false, delete_attempts: 0, cleanup_confirmed: false,
              events_seen: 0, incoming_bytes: 0, invalid_events: 0, projected_bytes: 0, events: [], reason: null };
            state.create_http_status = null; state.delete_http_status = null;
            state.create_error_codes = []; state.delete_error_codes = [];
            state.create_other_error_count = 0; state.delete_other_error_count = 0;
            let token;
            try {
              token = context(); state.create_attempts = 1;
              const result = await request(token, "POST", null, state);
              requireFact(result && typeof result.id === "string" && /^[A-Za-z0-9_-]{1,32}$/.test(result.id), "tail_id_shape");
              state.tail_id = result.id; state.created = true;
              const expiry = typeof result.expires_at === "string" ? Date.parse(result.expires_at) : NaN;
              if (Number.isFinite(expiry) && expiry >= 0 && expiry < 4102444800000)
                state.expires_at = new Date(expiry).toISOString();
              requireFact(state.expires_at !== null && expiry > Date.now() + 90000, "tail_expired_or_invalid");
              await observe(tailUrl(result.url), state);
            } catch (error) {
              state.reason = error instanceof Refusal ? error.message : "unexpected_shape";
            } finally {
              if (state.tail_id !== null) {
                state.delete_attempts = 1;
                try { await request(token, "DELETE", state.tail_id, state); state.cleanup_confirmed = true; }
                catch { state.cleanup_confirmed = false; }
              }
            }
            const status = state.connected && state.cleanup_confirmed &&
              ["observation_elapsed", "event_limit", "incoming_limit", "safe_output_limit"].includes(state.reason)
                ? "observed" : state.create_attempts ? "requires_reconciliation" : "refused";
            const tail_fingerprint = state.tail_id === null ? null :
              Buffer.from(await crypto.subtle.digest("SHA-256", Buffer.from(state.tail_id))).toString("hex");
            const { socket, projected_bytes, tail_id, ...safe } = state;
            safe.tail_fingerprint = tail_fingerprint;
            safe.omitted_events = state.events_seen - state.invalid_events - state.events.length;
            const output = JSON.stringify({ kind: "bounded_passive_worker_tail", status, ...safe });
            requireFact(Buffer.byteLength(output) <= MAX_OUTPUT, "final_output_limit");
            process.stdout.write(output + "\n");
            process.exitCode = status === "observed" ? 0 : 1;
          }
          main().catch(() => { process.stdout.write('{"kind":"bounded_passive_worker_tail","status":"requires_reconciliation","reason":"output_unavailable"}\n'); process.exitCode = 1; });
          JS
