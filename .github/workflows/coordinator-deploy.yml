name: Coordinator capacity serving diagnostics

# Operations branch only: do not merge this replacement of the deploy workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-deploy
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: coordinator
    steps:
      - name: Read the reviewed capacity serving metadata
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          ACCOUNT = "91b59577e757131d68d55a471fe32aca"
          WORKER = "crabbox-coordinator"
          BASE = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/workers"
          SETTINGS = f"/scripts/{WORKER}/settings"
          NAMESPACES = "/durable_objects/namespaces?per_page=1000&page=1"
          TELEMETRY = "/observability/telemetry/query"
          BRANCH = "refs/heads/ops/capacity-settings-20261011"
          TARGET = "CRABBOX_MAX_ACTIVE_LEASES_PER_OWNER"
          MAX_RESPONSE = 2 * 1024 * 1024
          # Existing observations only, surrounding the single native capacity read.
          QUERY = {"queryId": "capacity-serving-version-20261011", "dry": True,
                   "timeframe": {"from": 1791762690000, "to": 1791762750000},
                   "view": "events", "limit": 200,
                   "parameters": {"filters": [{"key": "$workers.scriptName", "operation": "eq",
                                               "type": "string", "value": WORKER}]}}

          class Refusal(Exception):
              pass

          def require(condition, code):
              if not condition:
                  raise Refusal(code)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate_json_key")
                  result[key] = value
              return result

          def decode(raw):
              return json.loads(raw, object_pairs_hook=unique_object,
                                parse_constant=lambda _: require(False, "nonfinite_json"))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Cloudflare:
              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())

              def request(self, method, path, query=None):
                  require((method == "GET" and path in (SETTINGS, NAMESPACES) and query is None)
                          or (method == "POST" and path == TELEMETRY and query == QUERY), "request_scope")
                  headers = {"Authorization": "Bearer " + self.token, "Accept": "application/json"}
                  body = None
                  if query is not None:
                      headers["Content-Type"] = "application/json"
                      body = json.dumps(query, separators=(",", ":"), allow_nan=False).encode()
                  request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
                  try:
                      with self.opener.open(request, timeout=30) as response:
                          require(response.status == 200, "http_status")
                          raw = response.read(MAX_RESPONSE + 1)
                      require(len(raw) <= MAX_RESPONSE, "response_limit")
                      value = decode(raw)
                      require(isinstance(value, dict) and value.get("success") is True
                              and not value.get("errors"), "api_response")
                      expected = list if path == NAMESPACES else dict
                      require(isinstance(value.get("result"), expected), "api_result_shape")
                      return value["result"]
                  except Refusal:
                      raise
                  except urllib.error.HTTPError as error:
                      try:
                          error.close()
                      finally:
                          raise Refusal("request_unavailable") from None
                  except Exception:
                      raise Refusal("request_unavailable") from None

          def binding_map(settings):
              rows = settings.get("bindings")
              require(isinstance(rows, list), "bindings_missing")
              result = {}
              for row in rows:
                  require(isinstance(row, dict) and isinstance(row.get("name"), str)
                          and row["name"] and isinstance(row.get("type"), str), "binding_shape")
                  require(row["name"] not in result, "duplicate_binding")
                  result[row["name"]] = row
              return result

          def context():
              require(os.environ.get("GITHUB_REPOSITORY") == "openclaw/crabbox"
                      and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                      and os.environ.get("GITHUB_REF") == BRANCH
                      and os.environ.get("GITHUB_WORKFLOW_REF") ==
                          "openclaw/crabbox/.github/workflows/coordinator-deploy.yml@" + BRANCH
                      and re.fullmatch(r"[0-9a-f]{40}", os.environ.get("GITHUB_SHA", ""))
                      and os.environ.get("GITHUB_WORKFLOW_SHA") == os.environ["GITHUB_SHA"]
                      and os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "workflow_identity")
              token = os.environ.pop("CLOUDFLARE_API_TOKEN", "")
              require(bool(token) and not any(c.isspace() for c in token), "token_unavailable")
              return token

          def safe_identifier(value, pattern, reason):
              require(isinstance(value, str) and re.fullmatch(pattern, value), reason)
              return value


          def settings_observation(settings):
              bindings = binding_map(settings)
              owner = bindings.get(TARGET)
              require(isinstance(owner, dict), "owner_limit_missing")
              # Never interpret opaque binding content as the public numeric limit.
              limit = {"type": owner["type"] if owner["type"] in ("plain_text", "secret_text") else "other"}
              if owner["type"] == "plain_text":
                  limit["text"] = safe_identifier(owner.get("text"), r"[0-9]{1,16}", "owner_limit_shape")
              fleet = bindings.get("FLEET")
              require(isinstance(fleet, dict) and fleet.get("type") == "durable_object_namespace",
                      "fleet_binding_type")
              projected = {"name": "FLEET", "type": "durable_object_namespace",
                           "namespace_id": safe_identifier(fleet.get("namespace_id"), r"[0-9a-f]{32}", "fleet_id"),
                           "class_name": safe_identifier(fleet.get("class_name"), r"[A-Za-z_][A-Za-z0-9_]{0,127}", "fleet_class")}
              if fleet.get("script_name") is not None:
                  projected["script_name"] = safe_identifier(fleet["script_name"], r"[A-Za-z0-9_-]{1,128}", "fleet_script")
              for name in ("environment", "dispatch_namespace"):
                  if fleet.get(name) is not None:
                      projected[name] = safe_identifier(fleet[name], r"[A-Za-z0-9_-]{0,128}", "fleet_context")
              return {"owner_limit": limit, "fleet_binding": projected}


          def namespace_observation(rows, fleet):
              require(len(rows) <= 1000, "namespace_limit")
              found = [row for row in rows if isinstance(row, dict) and row.get("id") == fleet["namespace_id"]]
              require(len(found) == 1, "fleet_namespace_not_unique_on_first_page")
              row = found[0]
              return {"id": fleet["namespace_id"],
                      "class": safe_identifier(row.get("class"), r"[A-Za-z_][A-Za-z0-9_]{0,127}", "namespace_class"),
                      "script": safe_identifier(row.get("script"), r"[A-Za-z0-9_-]{1,128}", "namespace_script")}


          def telemetry_observation(result):
              events = result.get("events")
              require(isinstance(events, dict) and isinstance(events.get("events"), list)
                      and len(events["events"]) <= 200, "telemetry_events_shape")
              rows = []
              for event in events["events"]:
                  require(isinstance(event, dict), "telemetry_event_shape")
                  facts = event.get("$workers")
                  require(isinstance(facts, dict) and facts.get("scriptName") == WORKER, "telemetry_script_scope")
                  timestamp = event.get("timestamp")
                  require(type(timestamp) in (int, float) and QUERY["timeframe"]["from"] <= timestamp
                          <= QUERY["timeframe"]["to"], "telemetry_time_scope")
                  row = {"scriptName": WORKER, "timestamp": timestamp}
                  version = facts.get("scriptVersion")
                  if version is not None:
                      require(isinstance(version, dict), "telemetry_version_shape")
                      if version.get("id") is not None:
                          row["scriptVersion"] = {"id": safe_identifier(version["id"],
                              r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", "telemetry_version_id")}
                  for name, pattern in (("requestId", r"[0-9a-fA-F-]{16,64}"), ("durableObjectId", r"[0-9a-f]{64}")):
                      if facts.get(name) is not None:
                          row[name] = safe_identifier(facts[name], pattern, "telemetry_identifier")
                  if facts.get("outcome") is not None:
                      allowed = {"ok", "exception", "canceled", "exceededCpu", "exceededMemory",
                                 "memoryLimitExceeded", "cpuLimitExceeded", "unknown"}
                      row["outcome"] = facts["outcome"] if facts["outcome"] in allowed else "other"
                  if row not in rows:
                      rows.append(row)
              return {"status": "observed", "returned_events": len(events["events"]),
                      "at_limit": len(events["events"]) == 200, "invocations": rows}


          def main():
              output = {"status": "refused", "read_only": True, "patch_attempts": 0, "telemetry_queries": 0}
              try:
                  api = Cloudflare(context())
                  output.update(settings_observation(api.request("GET", SETTINGS)))
                  fleet = output["fleet_binding"]
                  namespace = namespace_observation(api.request("GET", NAMESPACES), fleet)
                  output["fleet_namespace"] = namespace
                  require(namespace["script"] == WORKER and namespace["class"] == "FleetDurableObject"
                          and fleet["class_name"] == namespace["class"]
                          and fleet.get("script_name", WORKER) == WORKER
                        and all(fleet.get(name) in (None, "") for name in ("environment", "dispatch_namespace")),
                        "fleet_route_mismatch")
                  output["telemetry_queries"] = 1
                  output["telemetry"] = telemetry_observation(api.request("POST", TELEMETRY, QUERY))
                  output["status"] = "serving_route_observed"
                  raw = json.dumps(output, allow_nan=False)
                  require(len(raw.encode()) <= 65536, "output_limit")
                  print(raw)
                  return 0
              except Exception as exc:
                  output.pop("telemetry", None)
                  output["reason"] = str(exc) if isinstance(exc, Refusal) else "unexpected_shape"
                  print(json.dumps(output, allow_nan=False))
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PY
