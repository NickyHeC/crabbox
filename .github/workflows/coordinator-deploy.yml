name: Coordinator temporary owner capacity

# Operations branch only: do not merge this replacement of the deploy workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-deploy
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: coordinator
    steps:
      - name: Apply the reviewed owner capacity setting
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -I -B - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          import uuid

          ACCOUNT = "91b59577e757131d68d55a471fe32aca"
          WORKER = "crabbox-coordinator"
          BASE = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/workers/scripts/{WORKER}"
          BRANCH = "refs/heads/ops/capacity-settings-20261011"
          TARGET = "CRABBOX_MAX_ACTIVE_LEASES_PER_OWNER"
          GUARD_LIMITS = ("CRABBOX_MAX_ACTIVE_LEASES", "CRABBOX_MAX_ACTIVE_LEASES_PER_ORG",
                          "CRABBOX_MAX_ACTIVE_LEASES_PER_CAPACITY_ADMIN")
          MAX_RESPONSE = 2 * 1024 * 1024

          class Refusal(Exception):
              pass

          def require(condition, code):
              if not condition:
                  raise Refusal(code)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate_json_key")
                  result[key] = value
              return result

          def decode(raw):
              return json.loads(raw, object_pairs_hook=unique_object,
                                parse_constant=lambda _: require(False, "nonfinite_json"))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Cloudflare:
              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())

              def request(self, method, path, settings=None):
                  require((method == "PATCH" and path == "/settings" and settings is not None)
                          or (method == "GET" and settings is None and
                              (path in ("/settings", "/versions?per_page=1", "/deployments")
                               or re.fullmatch(r"/versions/[0-9a-f-]{36}", path))), "request_scope")
                  headers = {"Authorization": "Bearer " + self.token, "Accept": "application/json"}
                  body = None
                  if settings is not None:
                      boundary = "capacity-" + uuid.uuid4().hex
                      raw = json.dumps(settings, separators=(",", ":"), allow_nan=False).encode()
                      body = (f'--{boundary}\r\nContent-Disposition: form-data; name="settings"\r\n'
                              'Content-Type: application/json\r\n\r\n').encode() + raw
                      body += f"\r\n--{boundary}--\r\n".encode()
                      headers["Content-Type"] = "multipart/form-data; boundary=" + boundary
                  request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
                  try:
                      with self.opener.open(request, timeout=30) as response:
                          require(response.status == 200, "http_status")
                          raw = response.read(MAX_RESPONSE + 1)
                      require(len(raw) <= MAX_RESPONSE, "response_limit")
                      value = decode(raw)
                      require(isinstance(value, dict) and value.get("success") is True
                              and not value.get("errors") and isinstance(value.get("result"), dict),
                              "api_response")
                      return value["result"]
                  except Refusal:
                      raise
                  except urllib.error.HTTPError as error:
                      try:
                          error.close()
                      finally:
                          raise Refusal("request_unavailable") from None
                  except Exception:
                      # Never include remote errors, URLs, headers or response bodies in output.
                      raise Refusal("request_unavailable") from None

          def version_id(value):
              require(isinstance(value, str) and
                      re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", value), "version_id")
              return value

          def binding_map(settings):
              rows = settings.get("bindings")
              require(isinstance(rows, list), "bindings_missing")
              result = {}
              for row in rows:
                  require(isinstance(row, dict) and isinstance(row.get("name"), str)
                          and row["name"] and isinstance(row.get("type"), str), "binding_shape")
                  require(row["name"] not in result, "duplicate_binding")
                  result[row["name"]] = row
              return result

          def writable_annotations(settings):
              annotations = settings.get("annotations", {})
              require(isinstance(annotations, dict) and
                      set(annotations) <= {"workers/message", "workers/tag", "workers/triggered_by"}
                      and all(isinstance(v, str) for v in annotations.values()), "annotation_shape")
              return {key: value for key, value in annotations.items() if key != "workers/triggered_by"}

          def comparable_settings(settings):
              result = copy.deepcopy(settings)
              result["bindings"] = binding_map(result)
              # Only this documented, server-set annotation may change. Empty/absent
              # annotations both mean there is no writable annotation to preserve.
              result["annotations"] = writable_annotations(result)
              return result

          def snapshot(api):
              settings = api.request("GET", "/settings")
              comparable_settings(settings)
              versions = api.request("GET", "/versions?per_page=1").get("items")
              require(isinstance(versions, list) and len(versions) == 1, "latest_version_shape")
              latest = version_id(versions[0].get("id"))
              deployments = api.request("GET", "/deployments").get("deployments")
              require(isinstance(deployments, list) and deployments, "deployment_missing")
              deployment = deployments[0]
              active = deployment.get("versions")
              require(isinstance(active, list) and len(active) == 1
                      and active[0].get("percentage") == 100
                      and active[0].get("version_id") == latest, "latest_not_fully_deployed")
              version = api.request("GET", "/versions/" + latest)
              require(version.get("id") == latest, "version_identity")
              resources = version.get("resources", {})
              script = resources.get("script", {})
              require(isinstance(script.get("etag"), str) and script["etag"]
                      and isinstance(resources.get("script_runtime"), dict), "code_identity_missing")
              code = {key: script[key] for key in ("etag", "handlers", "named_handlers") if key in script}
              return {"settings": settings, "version": latest, "deployment": deployment,
                      "code": code, "runtime": resources["script_runtime"]}

          def proposal(settings):
              bindings = binding_map(settings)
              values = {}
              for key in (TARGET, *GUARD_LIMITS):
                  row = bindings.get(key)
                  require(row is not None and set(row) == {"name", "type", "text"}
                          and row["type"] == "plain_text" and isinstance(row["text"], str),
                          "capacity_binding_type")
                  value = row["text"]
                  require(re.fullmatch(r"[0-9]{1,16}", value) and
                          0 < int(value) <= 9007199254740991, "capacity_limit_invalid")
                  values[key] = value
              require(values[TARGET] in ("10", "20"), "owner_limit_changed")
              require(all(int(values[key]) >= 20 for key in GUARD_LIMITS), "surrounding_limit_too_low")
              replacement = {"name": TARGET, "type": "plain_text", "text": "20"}
              desired = copy.deepcopy(settings)
              desired["bindings"] = [copy.deepcopy(row) for name, row in bindings.items()
                                     if name != TARGET] + [replacement]
              # Inherit the opaque admin membership and every other binding unchanged.
              patch = {"bindings": [{"name": name, "type": "inherit"} for name in bindings
                                    if name != TARGET] + [replacement],
                       "annotations": writable_annotations(settings)}
              return desired, patch, int(values[TARGET])

          def context():
              require(os.environ.get("GITHUB_REPOSITORY") == "openclaw/crabbox"
                      and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                      and os.environ.get("GITHUB_REF") == BRANCH
                      and os.environ.get("GITHUB_WORKFLOW_REF") ==
                          "openclaw/crabbox/.github/workflows/coordinator-deploy.yml@" + BRANCH
                      and re.fullmatch(r"[0-9a-f]{40}", os.environ.get("GITHUB_SHA", ""))
                      and os.environ.get("GITHUB_WORKFLOW_SHA") == os.environ["GITHUB_SHA"]
                      and os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "workflow_identity")
              token = os.environ.pop("CLOUDFLARE_API_TOKEN", "")
              require(bool(token) and not any(c.isspace() for c in token), "token_unavailable")
              return token

          def main():
              attempted = False
              confirmed = False
              expected_hash = None
              try:
                  api = Cloudflare(context())
                  before = snapshot(api)
                  desired, patch, original_limit = proposal(before["settings"])
                  # Read the same live identity and full settings immediately before
                  # writing. The workflow concurrency group serializes repo deploys;
                  # Cloudflare does not provide a conditional settings PATCH here.
                  require(snapshot(api) == before, "prewrite_changed")
                  if comparable_settings(desired) == comparable_settings(before["settings"]):
                      print(json.dumps({"status": "already_present", "patch_attempts": 0,
                                        "owner_limit": original_limit}))
                      return 0
                  expected_hash = hashlib.sha256(json.dumps(comparable_settings(desired), sort_keys=True,
                      separators=(",", ":"), allow_nan=False).encode()).hexdigest()
                  attempted = True
                  try:
                      api.request("PATCH", "/settings", patch)
                      confirmed = True
                  except Refusal:
                      pass  # Ambiguous response: observe only. Never retry the PATCH.
                  after = snapshot(api)
                  require(comparable_settings(after["settings"]) == comparable_settings(desired),
                          "postwrite_settings_mismatch")
                  require(after["code"] == before["code"] and after["runtime"] == before["runtime"],
                          "postwrite_code_mismatch")
                  print(json.dumps({"status": "applied_readback_verified", "patch_attempts": 1,
                                    "patch_response_confirmed": confirmed, "owner_limit": 20,
                                    "original_owner_limit": original_limit, "code_unchanged": True,
                                    "conditional_restore_target": 10, "restore_requires_review": True,
                                    "expected_settings_sha256": expected_hash,
                                    "before_version": before["version"], "after_version": after["version"]}))
                  return 0
              except Exception as exc:
                  print(json.dumps({"status": "requires_reconciliation" if attempted else "refused",
                                    "reason": str(exc) if isinstance(exc, Refusal) else "unexpected_shape",
                                    "patch_attempts": int(attempted),
                                    "patch_response_confirmed": confirmed,
                                    **({"expected_settings_sha256": expected_hash} if attempted else {})}))
                  return 1

          if __name__ == "__main__":
              sys.exit(main())
          PY
