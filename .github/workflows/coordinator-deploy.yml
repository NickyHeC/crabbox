name: Coordinator failure telemetry diagnostics

# Operations branch only: do not merge this replacement of the deploy workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coordinator-deploy
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: coordinator
    steps:
      - name: Read the reviewed failure telemetry
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 -I -B - <<'PY'
          import json
          import hashlib
          from datetime import datetime, timezone
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          ACCOUNT = "91b59577e757131d68d55a471fe32aca"
          WORKER = "crabbox-coordinator"
          BASE = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/workers"
          SETTINGS = f"/scripts/{WORKER}/settings"
          TARGET = "CRABBOX_MAX_ACTIVE_LEASES_PER_OWNER"
          TELEMETRY = "/observability/telemetry/query"
          BRANCH = "refs/heads/ops/capacity-settings-20261011"
          MAX_RESPONSE = 2 * 1024 * 1024
          MAX_PROJECTED_ROWS = 48 * 1024
          # Existing events only. A dry query does not save a query or change logging.
          QUERY = {"queryId": "coordinator-failure-20261012", "dry": True,
                   "timeframe": {"from": 1791764640000, "to": 1791765060000},
                   "view": "events", "limit": 200,
                   "parameters": {"filters": [{"key": "$workers.scriptName", "operation": "eq",
                                               "type": "string", "value": WORKER}]}}
          SOURCE_FILES = {"index.js", "src/index.ts", "src/fleet.ts", "src/coordinator-entry.ts",
                          "src/coordinator-runtime.ts", "src/aws.ts", "src/provider-key.ts",
                          "node_modules/ssh2/lib/keygen.js", "node_modules/ssh2/lib/protocol/keyParser.js"}
          ERROR_NAMES = {"Error", "TypeError", "RangeError", "ReferenceError", "SyntaxError",
                         "URIError", "EvalError", "AggregateError", "DOMException"}

          class Refusal(Exception):
              pass

          def require(condition, code):
              if not condition:
                  raise Refusal(code)

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "duplicate_json_key")
                  result[key] = value
              return result

          def decode(raw):
              return json.loads(raw, object_pairs_hook=unique_object,
                                parse_constant=lambda _: require(False, "nonfinite_json"))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class Cloudflare:
              def __init__(self, token):
                  self.token = token
                  self.opener = urllib.request.build_opener(NoRedirect())
                  self.attempted = set()
                  self.observation = {}

              def read_response(self, response):
                  status = getattr(response, "status", None) or getattr(response, "code", None)
                  require(type(status) is int and 100 <= status <= 599, "http_status_shape")
                  self.observation["http_status"] = status
                  raw = response.read(MAX_RESPONSE + 1)
                  require(len(raw) <= MAX_RESPONSE, "response_limit")
                  try:
                      value = decode(raw)
                  except Exception:
                      raise Refusal("response_json") from None
                  require(isinstance(value, dict), "api_response_shape")
                  errors = value.get("errors")
                  if isinstance(errors, list) and len(errors) <= 64:
                      self.observation["api_error_codes"] = sorted({item["code"] for item in errors
                          if isinstance(item, dict) and type(item.get("code")) is int
                          and 0 <= item["code"] <= 2147483647})
                  else:
                      self.observation["api_error_codes"] = []
                  require(status == 200, "http_status")
                  require(value.get("success") is True and not errors, "api_response")
                  require(isinstance(value.get("result"), dict), "api_result_shape")
                  return value["result"]

              def request(self, method, path, query=None):
                  require((method == "POST" and path == TELEMETRY and query == QUERY)
                          or (method == "GET" and path == SETTINGS and query is None), "request_scope")
                  require(path not in self.attempted, "request_already_attempted")
                  self.attempted.add(path)
                  self.observation = {}
                  headers = {"Authorization": "Bearer " + self.token, "Accept": "application/json",
                             "Content-Type": "application/json"}
                  body = None if query is None else json.dumps(query, separators=(",", ":"), allow_nan=False).encode()
                  request = urllib.request.Request(BASE + path, data=body, headers=headers, method=method)
                  try:
                      try:
                          response = self.opener.open(request, timeout=30)
                      except urllib.error.HTTPError as error:
                          response = error
                      try:
                          return self.read_response(response)
                      finally:
                          response.close()
                  except Refusal:
                      raise
                  except Exception:
                      raise Refusal("request_unavailable") from None

          def context():
              require(os.environ.get("GITHUB_REPOSITORY") == "openclaw/crabbox"
                      and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
                      and os.environ.get("GITHUB_REF") == BRANCH
                      and os.environ.get("GITHUB_WORKFLOW_REF") ==
                          "openclaw/crabbox/.github/workflows/coordinator-deploy.yml@" + BRANCH
                      and re.fullmatch(r"[0-9a-f]{40}", os.environ.get("GITHUB_SHA", ""))
                      and os.environ.get("GITHUB_WORKFLOW_SHA") == os.environ["GITHUB_SHA"]
                      and os.environ.get("GITHUB_RUN_ATTEMPT") == "1", "workflow_identity")
              token = os.environ.pop("CLOUDFLARE_API_TOKEN", "")
              require(bool(token) and not any(c.isspace() for c in token), "token_unavailable")
              return token

          def safe_identifier(value, pattern, reason):
              require(isinstance(value, str) and re.fullmatch(pattern, value), reason)
              return value

          # Telemetry documents source as string | unknown object, not a typed exception.
          # Recognize only explicit error strings/objects; do not traverse arbitrary logs.
          def exception_observation(event):
              texts = []
              names = []
              metadata = event.get("$metadata")
              if isinstance(metadata, dict) and isinstance(metadata.get("error"), str):
                  texts.append(metadata["error"])
              source = event.get("source")
              if isinstance(source, str):
                  texts.append(source)
              elif isinstance(source, dict):
                  for field in ("message", "stack"):
                      if isinstance(source.get(field), str):
                          texts.append(source[field])
                  if isinstance(source.get("name"), str):
                      names.append(source["name"])
                  error = source.get("error")
                  if isinstance(error, dict):
                      if isinstance(error.get("name"), str):
                          names.append(error["name"])
                      for field in ("message", "stack"):
                          if isinstance(error.get(field), str):
                              texts.append(error[field])
              category = next((name for name in names if name in ERROR_NAMES), "unrecognized")
              locations = []
              omitted = False
              for text in texts:
                  if len(text) > 16384:
                      omitted = True
                      continue
                  first = text.split("\n", 1)[0].split(":", 1)[0]
                  if category == "unrecognized" and first in ERROR_NAMES:
                      category = first
                  for line in text.splitlines():
                      if not line.lstrip().startswith("at "):
                          continue
                      match = re.fullmatch(r"[ \t]{0,16}at (?:[^()\r\n]{1,160} \()?([^()\s]+):([0-9]{1,7}):([0-9]{1,7})\)?", line)
                      if not match or match[1] not in SOURCE_FILES or not 1 <= int(match[2]) <= 9999999 or not 1 <= int(match[3]) <= 9999999:
                          omitted = True
                          continue
                      location = {"file": match[1], "line": int(match[2]), "column": int(match[3])}
                      if location not in locations:
                          if len(locations) < 4:
                              locations.append(location)
                          else:
                              omitted = True
              return {"status": "recognized" if category != "unrecognized" or locations else "unrecognized",
                      "category": category, "locations": locations, "unrecognized_or_omitted_frames": omitted}

          def telemetry_observation(result):
              events = result.get("events")
              require(isinstance(events, dict) and isinstance(events.get("events"), list)
                      and len(events["events"]) <= 200, "telemetry_events_shape")
              rows = []
              encoded_rows_bytes = 2
              omitted_projected_events = 0
              for event in events["events"]:
                  require(isinstance(event, dict), "telemetry_event_shape")
                  facts = event.get("$workers")
                  require(isinstance(facts, dict) and facts.get("scriptName") == WORKER, "telemetry_script_scope")
                  timestamp = event.get("timestamp")
                  require(type(timestamp) in (int, float) and QUERY["timeframe"]["from"] <= timestamp
                          <= QUERY["timeframe"]["to"], "telemetry_time_scope")
                  row = {"scriptName": WORKER, "timestamp": timestamp}
                  version = facts.get("scriptVersion")
                  if version is not None:
                      require(isinstance(version, dict), "telemetry_version_shape")
                      if version.get("id") is not None:
                          row["scriptVersion"] = {"id": safe_identifier(version["id"],
                              r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", "telemetry_version_id")}
                  for name, pattern in (("requestId", r"[0-9a-fA-F-]{16,64}"), ("durableObjectId", r"[0-9a-f]{64}")):
                      if facts.get(name) is not None:
                          row[name] = safe_identifier(facts[name], pattern, "telemetry_identifier")
                  if facts.get("outcome") is not None:
                      allowed = {"ok", "exception", "canceled", "exceededCpu", "exceededMemory",
                                 "memoryLimitExceeded", "cpuLimitExceeded", "unknown"}
                      row["outcome"] = facts["outcome"] if isinstance(facts["outcome"], str) and facts["outcome"] in allowed else "other"
                  row["exception"] = exception_observation(event)
                  metadata = event.get("$metadata")
                  if isinstance(metadata, dict) and type(metadata.get("statusCode")) is int and 100 <= metadata["statusCode"] <= 599:
                      row["statusCode"] = metadata["statusCode"]
                  if row not in rows:
                      row_bytes = len(json.dumps(row, allow_nan=False).encode()) + (2 if rows else 0)
                      if encoded_rows_bytes + row_bytes <= MAX_PROJECTED_ROWS:
                          rows.append(row)
                          encoded_rows_bytes += row_bytes
                      else:
                          # Count input events whose projection is absent from the retained rows.
                          omitted_projected_events += 1
              return {"status": "observed", "returned_events": len(events["events"]),
                      "at_limit": len(events["events"]) == 200, "invocations": rows,
                      "omitted_projected_events": omitted_projected_events,
                      "truncated_projection": omitted_projected_events > 0}

          def settings_observation(settings):
              rows = settings.get("bindings")
              require(isinstance(rows, list), "settings_bindings_shape")
              bindings = {}
              for row in rows:
                  require(isinstance(row, dict) and isinstance(row.get("name"), str)
                          and row["name"] not in bindings, "settings_binding_shape")
                  bindings[row["name"]] = row
              normalized = dict(settings, bindings=sorted(rows, key=lambda row: row["name"]))
              settings_hash = hashlib.sha256(json.dumps(normalized, sort_keys=True, separators=(",", ":"),
                                                        ensure_ascii=False, allow_nan=False).encode()).hexdigest()
              target = bindings.get(TARGET)
              projected = {"present": target is not None}
              if target is not None:
                  kind = target.get("type")
                  projected["type"] = kind if kind in ("plain_text", "secret_text") else "other"
                  if kind == "plain_text":
                      text = target.get("text")
                      require(isinstance(text, str) and re.fullmatch(r"[1-9][0-9]{0,9}", text)
                              and int(text) <= 2147483647, "owner_limit_shape")
                      projected["value"] = int(text)
              return {"owner_limit": projected, "normalized_settings_sha256": settings_hash,
                      "observed_at": datetime.now(timezone.utc).isoformat()}

          def main():
              output = {"status": "refused", "read_only": True, "patch_attempts": 0,
                        "settings_reads": 0, "telemetry_queries": 0, "api": {}}
              try:
                  api = Cloudflare(context())
                  complete = True
                  for label, method, path, query, project in (
                      ("settings", "GET", SETTINGS, None, settings_observation),
                      ("telemetry", "POST", TELEMETRY, QUERY, telemetry_observation),
                  ):
                      output["settings_reads" if label == "settings" else "telemetry_queries"] = 1
                      try:
                          output[label] = project(api.request(method, path, query))
                      except Exception as exc:
                          complete = False
                          output[label] = {"status": "refused", "reason": str(exc) if isinstance(exc, Refusal) else "unexpected_shape"}
                      output["api"][label] = api.observation
                  output["status"] = "diagnostics_observed" if complete else "diagnostics_incomplete"
                  raw = json.dumps(output, allow_nan=False)
                  require(len(raw.encode()) <= 65536, "output_limit")
                  print(raw)
                  return 0 if complete else 1
              except Exception as exc:
                  output.pop("telemetry", None)
                  output["status"] = "refused"
                  output["reason"] = str(exc) if isinstance(exc, Refusal) else "unexpected_shape"
                  print(json.dumps(output, allow_nan=False))
                  return 1

          if __name__ == "__main__":
              sys.exit(main())
          PY
